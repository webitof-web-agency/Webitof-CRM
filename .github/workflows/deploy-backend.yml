name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/crm
          chmod 600 ~/.ssh/crm

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload backend
        run: |
          rsync -az --delete \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="logs" \
            --exclude="uploads" \
            -e "ssh -i ~/.ssh/crm -p ${{ secrets.SSH_PORT }}" \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/wwwroot/WebitofCRM/backend/
      
      - name: Install and restart backend
        run: |
          ssh \
            -i ~/.ssh/crm \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

          set -e

          cd /www/wwwroot/WebitofCRM/backend

          npm ci
          npm run build --if-present

          pm2 restart WebitofCRM-backend --update-env
          pm2 save

          EOF