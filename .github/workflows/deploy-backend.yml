name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify backend files
        run: |
          echo "Checking backend deployment files..."

          test -f backend/package.json || {
            echo "ERROR: backend/package.json is missing"
            exit 1
          }

          test -f backend/package-lock.json || {
            echo "ERROR: backend/package-lock.json is not committed to GitHub"
            echo "Backend contents:"
            ls -la backend/
            exit 1
          }

          ls -lah backend/package.json backend/package-lock.json

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/crm
          chmod 600 ~/.ssh/crm

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload backend
        run: |
          rsync -az --delete \
            --no-owner \
            --no-group \
            --chown=www:www \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="logs" \
            --exclude="uploads" \
            -e "ssh -i ~/.ssh/crm -p ${{ secrets.SSH_PORT }}" \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/wwwroot/WebitofCRM/backend/

      - name: Install and restart backend
        run: |
          ssh \
            -i ~/.ssh/crm \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

          set -e

          cd /www/wwwroot/WebitofCRM/backend

          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json was not deployed"
            ls -la
            exit 1
          fi

          echo "Package files:"
          ls -lah package.json package-lock.json

          echo "Installing dependencies..."
          npm ci

          echo "Running build if configured..."
          npm run build --if-present

          echo "Restarting backend..."
          pm2 restart WebitofCRM-backend --update-env

          pm2 save

          echo "Deployment completed successfully."

          EOF