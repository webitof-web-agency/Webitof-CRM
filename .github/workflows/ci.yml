name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json is not committed for the frontend, so npm ci cannot be used.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
      # Every *.test.js runs: none need a database (models are stubbed). *.integration.js and the smoke scripts do,
      # and googleDrive.test.js shells out to pg_dump, so those stay out of CI.
      - name: Unit tests (no database)
        run: >
          find tests -maxdepth 1 -name "*.test.js" -not -name "googleDrive.test.js" -print0
          | xargs -0 node --test
